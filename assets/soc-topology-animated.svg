<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">SOC &amp; ITSM automation platform topology</title>
  <desc id="svgDesc">Windows Server 2025 Core logs flow to Wazuh SIEM, then to the n8n orchestrator, which routes low-severity alerts to Slack and high-severity alerts to WAF containment and an ITSM ticket.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1b222c"/>
    </pattern>

    <linearGradient id="n8nFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172433"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>

    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="950" height="380" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="950" height="380" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#a855f7"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:9px}
    .card{fill:#161b22;stroke:#30363d;stroke-width:1}
    .h{font-size:11.5px;font-weight:600;fill:#e6edf3}
    .r{font-size:9.5px;fill:#8b949e}
    .tag{font-size:8px;font-weight:700;letter-spacing:1.2px}
    .lbl{font-size:8px;fill:#7d8590;text-anchor:middle}
    .ic{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

    .base{fill:none;stroke-width:1.5;stroke-opacity:.4}
    .pk{fill:none;stroke-linecap:round;stroke-width:5;animation-timing-function:linear;animation-iteration-count:infinite}
    .p50{stroke-dasharray:.1 49.9;animation-name:f50;animation-duration:.9s}
    .p33{stroke-dasharray:.1 33.233;animation-name:f33;animation-duration:1.5s}
    .p33r{stroke-dasharray:.1 33.233;animation-name:f33;animation-duration:1.1s}
    @keyframes f50{from{stroke-dashoffset:0}to{stroke-dashoffset:-50}}
    @keyframes f33{from{stroke-dashoffset:0}to{stroke-dashoffset:-33.333}}

    .pulse{animation:pulse 3s ease-in-out infinite}
    .blink{animation:blink 2s ease-in-out infinite}
    .alert{animation:alert 1.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.65}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    @keyframes alert{0%,100%{opacity:.35}50%{opacity:1}}

    @media (prefers-reduced-motion:reduce){
      .pk,.pulse,.blink,.alert{animation:none}
    }
  </style>

  <!-- Background -->
  <rect width="950" height="380" fill="#0d1117"/>
  <rect width="950" height="380" fill="url(#grid)"/>

  <!-- Header -->
  <text x="16" y="30" font-size="11" font-weight="700" letter-spacing="2" fill="#e6edf3">SOC &amp; ITSM AUTOMATION PLATFORM</text>
  <text x="16" y="44" font-size="9" fill="#7d8590">Detect → Orchestrate → Respond</text>
  <circle cx="834" cy="27" r="3.5" fill="#22c55e" class="blink"/>
  <text x="934" y="30" font-size="9" font-weight="700" letter-spacing="1.5" fill="#22c55e" text-anchor="end">LIVE PIPELINE</text>

  <!-- n8n glow halo -->
  <rect x="444" y="72" width="210" height="236" rx="12" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#bigGlow)" class="pulse"/>

  <!-- ============ CARD 1: Windows Server ============ -->
  <rect class="card" x="16" y="128" width="180" height="124" rx="10"/>
  <circle cx="180" cy="143" r="3.5" fill="#22c55e" class="blink"/>
  <g class="ic" stroke="#38bdf8" transform="translate(152 133)">
    <rect x="0" y="0" width="20" height="8" rx="2"/>
    <rect x="0" y="11" width="20" height="8" rx="2"/>
    <circle cx="4" cy="4" r=".8" fill="#38bdf8"/>
    <circle cx="4" cy="15" r=".8" fill="#38bdf8"/>
  </g>
  <text class="tag" x="30" y="148" fill="#38bdf8">SOURCE LOG LAYER</text>
  <text class="h" x="30" y="168">Windows Server 2025 Core</text>
  <text class="r" x="30" y="185">Active Directory DS / LDAPS</text>
  <text class="r" x="30" y="198">&amp; Security Event Logs</text>
  <text class="mono" x="30" y="220" fill="#7d8590">IP: 192.168.1.10</text>
  <text class="mono" x="30" y="233" fill="#7d8590">Agent ID: 001</text>

  <!-- ============ CARD 2: Wazuh ============ -->
  <rect class="card" x="230" y="128" width="180" height="124" rx="10"/>
  <circle cx="394" cy="143" r="3.5" fill="#22c55e" class="blink" style="animation-delay:.4s"/>
  <g class="ic" stroke="#38bdf8" transform="translate(366 133)">
    <path d="M10 0 L19 3 V10 C19 15 15 18.5 10 20 C5 18.5 1 15 1 10 V3 Z"/>
    <path d="M6 10 L9 13 L14 7"/>
  </g>
  <text class="tag" x="244" y="148" fill="#38bdf8">SIEM LAYER</text>
  <text class="h" x="244" y="168">Wazuh SIEM</text>
  <text class="r" x="244" y="185">Log Aggregation &amp;</text>
  <text class="r" x="244" y="198">Threat Detection</text>
  <text class="mono" x="244" y="220" fill="#7d8590">Alert Rule: 550 (Level 10)</text>
  <circle cx="246" cy="230" r="2.6" fill="#ef4444" class="alert" filter="url(#glow)"/>
  <text class="mono" x="254" y="233" fill="#ef4444">Threat Detected</text>

  <!-- ============ CARD 3: n8n (highlighted) ============ -->
  <rect x="444" y="72" width="210" height="236" rx="12" fill="url(#n8nFill)" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="638" cy="89" r="3.5" fill="#22c55e" class="blink" style="animation-delay:.8s"/>
  <g class="ic" stroke="#38bdf8" transform="translate(608 79)">
    <circle cx="3" cy="10" r="2.6"/>
    <circle cx="17" cy="3.5" r="2.6"/>
    <circle cx="17" cy="16.5" r="2.6"/>
    <path d="M5.4 9 L14.6 4.5 M5.4 11 L14.6 15.5"/>
  </g>
  <text class="tag" x="458" y="92" fill="#38bdf8">SOAR ORCHESTRATOR</text>
  <text x="458" y="112" font-size="13" font-weight="700" fill="#e6edf3">n8n Orchestrator</text>
  <text class="r" x="458" y="129">Automated Webhook Processing</text>
  <text class="r" x="458" y="142">&amp; Decision Engine</text>
  <line x1="458" y1="152" x2="640" y2="152" stroke="#30363d"/>
  <text class="tag" x="458" y="168" fill="#8b949e">DECISION LOGIC</text>

  <rect x="458" y="178" width="182" height="42" rx="6" fill="#a855f7" fill-opacity=".08" stroke="#a855f7" stroke-opacity=".7"/>
  <text class="mono" x="468" y="194" font-size="10" font-weight="700" fill="#c4b5fd" style="font-size:10px">IF Severity &lt; 8</text>
  <text class="r" x="468" y="210">→ Route to Triage Channel</text>

  <rect x="458" y="230" width="182" height="64" rx="6" fill="#ef4444" fill-opacity=".08" stroke="#ef4444" class="alert" filter="url(#glow)"/>
  <text class="mono" x="468" y="247" font-weight="700" fill="#fca5a5" style="font-size:10px">IF Severity &gt;= 8</text>
  <text class="r" x="468" y="263">→ Trigger Active WAF Block</text>
  <text class="r" x="468" y="277">&amp; Escalate Ticket</text>

  <!-- ============ CARD 4: Slack ============ -->
  <rect class="card" x="716" y="52" width="218" height="84" rx="10"/>
  <circle cx="918" cy="69" r="3.5" fill="#22c55e" class="blink" style="animation-delay:1.1s"/>
  <g class="ic" stroke="#a855f7" stroke-width="1.6" transform="translate(888 60)">
    <path d="M7 2 L5 18 M14 2 L12 18 M2 7 H18 M1 13 H17"/>
  </g>
  <text class="tag" x="730" y="70" fill="#a855f7">NOTIFICATION LAYER</text>
  <text class="h" x="730" y="88">Slack Bot Dispatcher</text>
  <text class="mono" x="730" y="105"><tspan fill="#c4b5fd">#soc-alerts</tspan><tspan fill="#7d8590"> · </tspan><tspan fill="#fca5a5">#soc-blocks</tspan></text>
  <text class="mono" x="730" y="118" fill="#8b949e">#soc-pipeline-errors</text>

  <!-- ============ CARD 5: WAF ============ -->
  <rect class="card" x="716" y="148" width="218" height="84" rx="10"/>
  <rect x="716" y="148" width="218" height="84" rx="10" fill="none" stroke="#ef4444" stroke-width="1.5" class="alert" filter="url(#glow)"/>
  <circle cx="918" cy="165" r="3.5" fill="#22c55e" class="blink" style="animation-delay:1.5s"/>
  <g class="ic" stroke="#ef4444" transform="translate(888 156)">
    <path d="M10 0 L19 3 V10 C19 15 15 18.5 10 20 C5 18.5 1 15 1 10 V3 Z"/>
    <path d="M6.5 7.5 L13.5 12.5 M13.5 7.5 L6.5 12.5"/>
  </g>
  <text class="tag" x="730" y="166" fill="#ef4444">ACTION LAYER</text>
  <text class="h" x="730" y="184">SafeLine WAF / FortiGate</text>
  <text class="mono" x="730" y="201" fill="#fca5a5">POST /api/v1/ip-ban</text>
  <text x="730" y="215" font-size="9.5" font-weight="700" fill="#ef4444">→ Active Containment</text>

  <!-- ============ CARD 6: ITSM ============ -->
  <rect class="card" x="716" y="244" width="218" height="84" rx="10"/>
  <circle cx="918" cy="261" r="3.5" fill="#22c55e" class="blink" style="animation-delay:.2s"/>
  <g class="ic" stroke="#38bdf8" transform="translate(888 251)">
    <rect x="0" y="3" width="20" height="14" rx="2"/>
    <path d="M6 3 V17" stroke-dasharray="2 2"/>
    <path d="M10 8 H16 M10 12 H14"/>
  </g>
  <text class="tag" x="730" y="262" fill="#38bdf8">ITSM LAYER</text>
  <text class="h" x="730" y="280">FastAPI &amp; React ITSM Portal</text>
  <text class="r" x="730" y="297">Incident Ticket Created</text>
  <text class="r" x="730" y="310">&amp; Routed via LDAPS</text>

  <!-- ============ CONNECTIONS (base line + packet stream) ============ -->
  <!-- Windows to Wazuh (telemetry) -->
  <path class="base" d="M196 190 L230 190" stroke="#38bdf8" marker-end="url(#arrC)"/>
  <path class="pk p50" pathLength="100" d="M196 190 L230 190" stroke="#38bdf8" filter="url(#glow)"/>
  <text class="lbl" x="213" y="181">events</text>

  <!-- Wazuh to n8n (telemetry) -->
  <path class="base" d="M410 190 L444 190" stroke="#38bdf8" marker-end="url(#arrC)"/>
  <path class="pk p50" pathLength="100" d="M410 190 L444 190" stroke="#38bdf8" filter="url(#glow)" style="animation-delay:-.3s"/>
  <text class="lbl" x="427" y="181">alerts</text>

  <!-- n8n to Slack (severity below 8, purple) -->
  <path class="base" d="M640 199 C680 199 676 94 716 94" stroke="#a855f7" marker-end="url(#arrP)"/>
  <path class="pk p33" pathLength="100" d="M640 199 C680 199 676 94 716 94" stroke="#a855f7" filter="url(#glow)"/>

  <!-- n8n to WAF (severity 8 or above, critical red) -->
  <path class="base" d="M640 262 C680 262 676 190 716 190" stroke="#ef4444" stroke-opacity=".6" marker-end="url(#arrR)" filter="url(#glow)"/>
  <path class="pk p33r" pathLength="100" d="M640 262 C680 262 676 190 716 190" stroke="#ef4444" stroke-width="6" filter="url(#glow)"/>

  <!-- n8n to ITSM (escalation, critical red) -->
  <path class="base" d="M640 262 C680 262 676 286 716 286" stroke="#ef4444" stroke-opacity=".6" marker-end="url(#arrR)" filter="url(#glow)"/>
  <path class="pk p33" pathLength="100" d="M640 262 C680 262 676 286 716 286" stroke="#ef4444" filter="url(#glow)" style="animation-delay:-.6s"/>

  <!-- ============ LEGEND ============ -->
  <line x1="16" y1="344" x2="934" y2="344" stroke="#21262d"/>
  <circle cx="22" cy="358" r="3.5" fill="#38bdf8"/>
  <text x="32" y="361" font-size="9.5" fill="#8b949e">Standard telemetry</text>
  <circle cx="152" cy="358" r="3.5" fill="#a855f7"/>
  <text x="162" y="361" font-size="9.5" fill="#8b949e">Slack notifications</text>
  <circle cx="282" cy="358" r="3.5" fill="#ef4444"/>
  <text x="292" y="361" font-size="9.5" fill="#8b949e">Critical path / WAF containment</text>
  <circle cx="476" cy="358" r="3.5" fill="#22c55e"/>
  <text x="486" y="361" font-size="9.5" fill="#8b949e">Active status</text>
</svg>