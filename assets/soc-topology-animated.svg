<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" role="img" aria-labelledby="title description">
  <title id="title">SOC System Architecture and Automation Topology</title>
  <desc id="description">Animated infrastructure diagram connecting an analyst laptop, SOC core services, Tailscale mesh, Proxmox-hosted security virtual machines, external threat intelligence and AI services, and the SOAR response pipeline.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#30363d" stroke-opacity=".28" stroke-width="1"/>
    </pattern>
    <filter id="glow-blue" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orange" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#f97316"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#ef4444"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #c9d1d9; }
      .title { fill: #f0f6fc; font-size: 15px; font-weight: 700; }
      .subtitle { fill: #8b949e; font-size: 10px; }
      .label { fill: #c9d1d9; font-size: 10px; }
      .small { fill: #8b949e; font-size: 9px; }
      .tiny { fill: #8b949e; font-size: 8px; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.3; }
      .inner { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .flow-blue { fill: none; stroke: #38bdf8; stroke-width: 2; }
      .flow-purple { fill: none; stroke: #a855f7; stroke-width: 2; }
      .flow-orange { fill: none; stroke: #f97316; stroke-width: 2; }
      .flow-green { fill: none; stroke: #22c55e; stroke-width: 2; }
      .flow-red { fill: none; stroke: #ef4444; stroke-width: 2; }
      .packet-blue { fill: none; stroke: #38bdf8; stroke-width: 3; stroke-dasharray: 2 16; stroke-linecap: round; filter: url(#glow-blue); animation: travel 2.8s linear infinite; }
      .packet-purple { fill: none; stroke: #a855f7; stroke-width: 3; stroke-dasharray: 2 15; stroke-linecap: round; filter: url(#glow-purple); animation: travel 2.2s linear infinite; }
      .packet-orange { fill: none; stroke: #f97316; stroke-width: 3; stroke-dasharray: 2 14; stroke-linecap: round; filter: url(#glow-orange); animation: travel 2.5s linear infinite; }
      .packet-green { fill: none; stroke: #22c55e; stroke-width: 3; stroke-dasharray: 2 15; stroke-linecap: round; filter: url(#glow-green); animation: travel 3.2s linear infinite; }
      .packet-red { fill: none; stroke: #ef4444; stroke-width: 3; stroke-dasharray: 2 13; stroke-linecap: round; filter: url(#glow-red); animation: travel 1.8s linear infinite; }
      .status { fill: #22c55e; animation: pulse 1.8s ease-in-out infinite; }
      .blue { fill: #38bdf8; }
      .purple { fill: #a855f7; }
      .orange { fill: #f97316; }
      .green { fill: #22c55e; }
      .red { fill: #ef4444; }
      @keyframes travel { to { stroke-dashoffset: -72; } }
      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) {
        .packet-blue, .packet-purple, .packet-orange, .packet-green, .packet-red, .status {
          animation: none;
        }
      }
    </style>
